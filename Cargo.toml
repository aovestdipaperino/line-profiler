[package]
name = "line-profiler"
version = "0.1.0"
edition = "2024"
authors = ["Enzo Lombardi <enzinol@gmail.com>"]
description = "A line-level profiler for Rust with Cargo integration"
license = "MIT"
repository = "https://github.com/aovestdipaperino/line-profiler"
homepage = "https://github.com/aovestdipaperino/line-profiler"
readme = "README.md"
keywords = ["profiler", "profiling", "performance", "line-profiler", "cargo"]
categories = ["development-tools::profiling", "command-line-utilities"]

[[bin]]
name = "cargo-profile-build"
path = "src/bin/cargo-profile-build.rs"

[[bin]]
name = "cargo-profile-run"
path = "src/bin/cargo-profile-run.rs"

[[bin]]
name = "rustc-wrapper"
path = "src/bin/rustc-wrapper.rs"

[[bin]]
name = "test-instrument"
path = "src/bin/test-instrument.rs"

[[bin]]
name = "linker-wrapper"
path = "src/bin/linker-wrapper.rs"

[[bin]]
name = "lprf"
path = "src/bin/lprf.rs"

[lib]
name = "line_profiler"
path = "src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
tempfile = "3"
regex = "1"
lprf-parser = { path = "lprf-parser" }
